# Checks, packages and tests every push and pull request. On main the release
# workflow calls it, then publishes the zips it packaged.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per branch: a push to a branch with an open pull request would
  # otherwise run twice at once, and lichess.org rate-limits the end-to-end
  # tests. When the release calls it, github.workflow is the release's, so its
  # runs never share a group with these.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: node scripts/check-sources.ts
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version counts the commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The tests load the extension, which only the full Chromium does: no headless shell.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --no-shell chromium
      # The cache holds the browser, not the system libraries it needs.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The zip the release ships, where the tests look for the extension.
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - run: mkdir -p dist && unzip -q packages/LichessDotCom-v*[0-9].zip -d dist/chrome
      - run: pnpm test:e2e
      # The dev reload ships in dev builds only: its spec runs on one too.
      - run: node scripts/build.ts --out dist/dev
      - run: pnpm exec playwright test tests/e2e/background.spec.ts
        env:
          CDC_EXTENSION_DIR: dist/dev

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  firefox:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The zip the release sends to Firefox Add-ons.
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - run: mkdir -p dist && unzip -q packages/LichessDotCom-v*-firefox.zip -d dist/firefox
      # Downloads Firefox's current release, then loads the extension into it.
      - run: pnpm test:firefox

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.9
          src: tools
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.9
          args: format --check
          src: tools

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
